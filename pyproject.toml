[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sample_project"
version = "0.0.1"
description = "Sample project for demonstration purposes."
authors = [
    { name = "Praveen" }
]

dependencies = [
    "databricks-sdk",
    "PyYAML==6.0.2",
    "setuptools~=78.1.1",
    "pytest",
    "pytest-cov",
    "databricks-cli",
    "pyspark>=3.0.0"
]
# Entry point (FIXED - very important)
[project.scripts]
run = "sample_project.main:main"

# If you really need custom groups (rare)
[project.entry-points."group_1"]
run = "sample_project.main:main"

# Tell setuptools where code is
[tool.setuptools.packages.find]
where = ["src"]

# Include non-code files
[tool.setuptools.package-data]
sample_project = ["resources/configs/**/*"]